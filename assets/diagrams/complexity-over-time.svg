<title id="t">Illustrative operational and coordination complexity over time for four architecture styles</title>
<desc id="d">Illustrative curves, not measured data. A monolith without enforced boundaries starts simple and becomes complex as it grows. A modular monolith grows more slowly. Microservices start with high fixed complexity and grow slowly. Serverless starts moderate and grows steadily.</desc>
