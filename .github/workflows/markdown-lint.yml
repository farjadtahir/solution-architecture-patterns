name: Markdown lint and link check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".github/workflows/markdown-lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".github/workflows/markdown-lint.yml"
  schedule:
    # Weekly run to catch links that rot over time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: ".markdownlint.json"
          globs: "**/*.md"

  link-check:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Relative links between files are checked too.
          # 403 and 429 are accepted because some sites block or rate limit bots.
          # Placeholder links are skipped until you replace them.
          args: >-
            --no-progress
            --max-retries 2
            --retry-wait-time 5
            --timeout 30
            --accept 200,201,202,203,204,206,403,429
            --exclude YOUR_USERNAME
            --exclude example\.com
            "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
